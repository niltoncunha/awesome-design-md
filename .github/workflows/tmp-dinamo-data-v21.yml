name: Temporary DINAMO public dataset transfer

on:
  push:
    branches: [tmp-dinamo-data-v21]

jobs:
  fetch-public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download public datasets
        run: |
          mkdir -p data
          curl -L --fail --retry 3 -o data/cifar-10-python.tar.gz https://data.brainchip.com/dataset-mirror/cifar10/cifar-10-python.tar.gz
          echo "c58f30108f718f92721af3b95e74349a  data/cifar-10-python.tar.gz" | md5sum -c -
          curl -L --fail --retry 3 -o data/cifar102_test.npz https://raw.githubusercontent.com/modestyachts/cifar-10.2/521467a52ad494b78ff9c70051099c0d9ba74d40/cifar102_test.npz
          sha256sum data/* | tee data/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dinamo-cifar-public-data-v21
          path: data/
          retention-days: 1
